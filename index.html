<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BLE-datDC</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='24' font-family='monospace' font-size='26' font-weight='bold' fill='%23ff0000' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #0a0c0f;
      --card: #10151b;
      --card2: #151c25;
      --border: #1e2d3d;
      --accent: #00d4ff;
      --ok: #00ff88;
      --warn: #ffb300;
      --err: #ff4757;
      --text: #c8d8e8;
      --dim: #6a8090;
      --mono: ui-monospace, "Share Tech Mono", Consolas, monospace;
      --sans: "Rajdhani", system-ui, -apple-system, "Segoe UI", sans-serif;
      --r: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
    }

    body { overscroll-behavior: none; }

    /* ===== LAYOUT ===== */
    html, body { overflow: hidden; }

    #app {
      height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
      padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "head" "ctrl" "log";
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    header { grid-area: head; }
    #colCtrl { grid-area: ctrl; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    #logCard { grid-area: log; min-height: 0; }

    /* Màn hình rộng hoặc điện thoại nằm ngang: 2 cột */
    @media (min-width: 860px), (orientation: landscape) and (min-width: 560px) {
      #app {
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        grid-template-areas: "head head" "ctrl log";
        grid-template-rows: auto minmax(0, 1fr);
      }
      #colCtrl { overflow-y: auto; padding-right: 2px; }
    }

    /* Điện thoại dọc: cuộn trang bình thường, điều khiển ở trên, nhật ký ở dưới */
    @media (max-width: 859px) and (orientation: portrait) {
      #app {
        display: block;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-top: max(8px, env(safe-area-inset-top));
      }
      header { height: 52px; margin-bottom: 8px; }
      #colCtrl { margin-bottom: 8px; }
      #logCard { height: 45dvh; margin-bottom: 8px; }
    }

    /* Gọn hơn trên màn hình nhỏ */
    @media (max-width: 859px) {
      .card { padding: 8px 10px; gap: 8px; }
      header { padding: 6px 10px; }
      .brand { font-size: 1.1rem; }
      .status { font-size: .8rem; }
      button { min-height: 40px; }
      #dcInput { font-size: 2rem; }
      .dc-box button { flex-basis: 48px; }
      .range-scale { display: none; }
      #cmdInput { min-height: 40px; }
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
    }

    .brand { font-weight: 700; font-size: 1.35rem; letter-spacing: .06em; color: var(--accent); }

    .status {
      display: flex; align-items: center; gap: 8px;
      font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: .95rem;
      color: var(--err);
    }
    .status::before {
      content: ""; width: 10px; height: 10px; border-radius: 50%;
      background: currentColor; box-shadow: 0 0 8px currentColor;
    }
    .status.connected { color: var(--ok); }

    /* ===== CARD ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      font-size: .85rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    /* ===== BUTTONS ===== */
    button {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .04em;
      min-height: 44px;
      padding: 0 14px;
      color: var(--text);
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s, transform .08s;
    }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .35; cursor: not-allowed; }

    button.primary { color: var(--ok); border-color: var(--ok); }
    button.primary:hover:not(:disabled) { background: rgba(0, 255, 136, .08); color: var(--ok); border-color: var(--ok); }
    button.danger { color: var(--warn); border-color: var(--warn); }
    button.danger:hover:not(:disabled) { background: rgba(255, 179, 0, .1); color: var(--warn); border-color: var(--warn); }
    button.toggle[aria-pressed="true"] { background: rgba(0, 212, 255, .12); border-color: var(--accent); color: var(--accent); }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1 1 0; min-width: 0; }

    /* ===== DC VALUE ===== */
    .dc-box { display: flex; align-items: stretch; gap: 8px; }
    .dc-box button { flex: 0 0 56px; font-size: 1.4rem; }

    #dcInput {
      flex: 1 1 auto;
      min-width: 0;
      text-align: center;
      font-family: var(--mono);
      font-size: 3rem;
      line-height: 1.2;
      color: var(--accent);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      text-shadow: 0 0 10px rgba(0, 212, 255, .4);
    }
    #dcInput:focus { border-color: var(--accent); }

    input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
    .range-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .75rem; color: var(--dim); margin-top: -6px; }

    /* ===== CMD ===== */
    #cmdInput {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 44px;
      padding: 0 12px;
      font-family: var(--mono);
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    #cmdInput:focus { border-color: var(--accent); }
    #cmdRow button { flex: 0 0 auto; }

    /* ===== OTA ===== */
    .progress { height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .15s; }
    .progress-text { font-family: var(--mono); font-size: .8rem; color: var(--dim); }

    /* ===== LOG ===== */
    #logCard { padding: 0; overflow: hidden; gap: 0; }
    .log-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--card2);
    }
    .log-head .tools { display: flex; gap: 6px; }
    .log-head button { min-height: 34px; padding: 0 10px; font-size: .9rem; }

    #logContent {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 8px 12px;
      background: var(--bg);
      font-family: var(--mono);
      font-size: .85rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #logContent .t { color: var(--dim); }
    #logContent .sys { color: var(--dim); }
    #logContent .tx { color: var(--accent); }
    #logContent .rx { color: var(--ok); }
    #logContent .err { color: var(--err); }
    #logContent::-webkit-scrollbar { width: 8px; }
    #logContent::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 99;
      display: none; align-items: center; justify-content: center;
      padding: 16px; background: rgba(0, 0, 0, .75); backdrop-filter: blur(2px);
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      width: 100%; max-width: 420px; padding: 18px;
      background: var(--card); border: 1px solid var(--warn); border-radius: var(--r);
      display: flex; flex-direction: column; gap: 14px;
    }
    .modal-title { text-align: center; font-weight: 700; font-size: 1.2rem; color: var(--warn); text-transform: uppercase; letter-spacing: .06em; }
    .modal-body { font-family: var(--mono); font-size: .9rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .modal-body .info { color: var(--accent); font-weight: 700; }
    .modal-body .warn { color: var(--err); font-weight: 700; }
  </style>
</head>

<body>
  <div id="app">

    <!-- ===== LOG (đặt trên đầu) ===== -->
    <section class="card" id="logCard">
      <div class="log-head">
        <h2>Nhật ký</h2>
        <div class="tools">
          <button id="btnClearLog">🗑 Xóa</button>
          <button id="btnSaveText">💾 Lưu</button>
        </div>
      </div>
      <div id="logContent"></div>
    </section>

    <!-- ===== KẾT NỐI (giữa nhật ký và điều khiển) ===== -->
    <header>
      <div id="statusBar" class="status">Chưa kết nối</div>
      <button id="btnConnect" class="danger">🔗 Kết nối</button>
    </header>

    <!-- ===== CỘT ĐIỀU KHIỂN ===== -->
    <div id="colCtrl">

      <section class="card">
        <h2>Giá trị DC (1 – 127)</h2>
        <div class="dc-box">
          <button id="btnDecrease" aria-label="Giảm">−</button>
          <input id="dcInput" type="text" inputmode="numeric" value="1" autocomplete="off" />
          <button id="btnIncrease" aria-label="Tăng">+</button>
        </div>
        <input id="dcRange" type="range" min="1" max="127" value="1" />
        <div class="range-scale"><span>1</span><span>64</span><span>127</span></div>
        <div class="row">
          <button id="btnRead" class="needs-conn">▶ Đọc </button>
          <button id="btnWrite" class="needs-conn">💾 Ghi </button>
        </div>
      </section>

      <section class="card">
        <h2>Điều khiển nhanh</h2>
        <div class="row">
          <button id="btnNhayLed" class="needs-conn toggle" aria-pressed="false">💡 Nháy LED</button>
          <button id="btnPhatXung" class="needs-conn toggle" aria-pressed="false">〰 Phát xung</button>
        </div>
      </section>

      <section class="card">
        <h2>Lệnh thủ công</h2>
        <div class="row" id="cmdRow">
          <input id="cmdInput" type="text" placeholder="Nhập lệnh..." autocomplete="off" />
          <button id="btnCmdSend" class="needs-conn">▶ Gửi</button>
        </div>
      </section>

      <section class="card">
        <h2>Cập nhật firmware</h2>
        <button id="btnOtaOnline" class="needs-conn">⬆ OTA online (GitHub)</button>
        <div class="progress"><div id="otaBar"></div></div>
        <div id="otaText" class="progress-text">Sẵn sàng</div>
      </section>
    </div>

  </div>

  <!-- ===== MODAL OTA ===== -->
  <div id="otaModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-title">⚠ Xác nhận OTA Online</div>
      <div class="modal-body" id="otaModalBody"></div>
      <div class="row">
        <button id="otaCancel">✖ Hủy</button>
        <button id="otaConfirm" class="danger">✔ Xác nhận</button>
      </div>
    </div>
  </div>

  <script>
    /* ==================== LOG ==================== */
    const logs = [];
    const MAX_LOG = 500;
    const logContent = document.getElementById("logContent");

    // type: sys | tx | rx | err
    function addLog(text, type = 'sys') {
      const time = new Date().toLocaleTimeString();
      logs.push(`[${time}] ${text}`);
      if (logs.length > MAX_LOG) logs.shift();

      const stick = logContent.scrollTop + logContent.clientHeight >= logContent.scrollHeight - 5;

      const line = document.createElement("div");
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = `[${time}] `;
      const m = document.createElement("span");
      m.className = type;
      m.textContent = text;
      line.append(t, m);
      logContent.appendChild(line);

      while (logContent.children.length > MAX_LOG) logContent.removeChild(logContent.firstChild);
      if (stick) logContent.scrollTop = logContent.scrollHeight;
    }

    window.addEventListener('load', () => {
      addLog('Web Bluetooth sẵn sàng. Nhấn "Kết nối" để bắt đầu.');
      if (!navigator.bluetooth) {
        addLog('⚠ Trình duyệt không hỗ trợ Web Bluetooth!', 'err');
        addLog('→ Nếu bạn đang sử dụng iphone hãy chuyển sang trình duyệt Bluefy.', 'err');
      }
      refreshUI();
    });

    /* ==================== TRẠNG THÁI UI ==================== */
    let busy = false;      // đang OTA
    let ledOn = false;
    let pxOn = false;

    const statusBar = document.getElementById('statusBar');
    const btnConnect = document.getElementById('btnConnect');
    const btnLed = document.getElementById('btnNhayLed');
    const btnPx = document.getElementById('btnPhatXung');

    function isConnected() { return !!(device && device.gatt.connected && txChar); }

    function refreshUI() {
      const c = isConnected();
      statusBar.textContent = c ? 'Đã kết nối' : 'Chưa kết nối';
      statusBar.className = 'status' + (c ? ' connected' : '');
      btnConnect.textContent = c ? '🔌 Ngắt kết nối' : '🔗 Kết nối';
      btnConnect.className = c ? 'primary' : 'danger';
      btnConnect.disabled = busy;

      document.querySelectorAll('.needs-conn').forEach(b => b.disabled = !c || busy);
      btnLed.setAttribute('aria-pressed', ledOn);
      btnPx.setAttribute('aria-pressed', pxOn);
    }

    /* ==================== WEB BLUETOOTH ==================== */
    const NUS_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_TX_CHAR_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const NUS_RX_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    let device = null, txChar = null, rxChar = null, rxBuffer = '';

    async function connectBLE() {
      if (!navigator.bluetooth) {
        addLog('Trình duyệt không hỗ trợ Web Bluetooth. Dùng Chrome/Edge/Opera.', 'err');
        return;
      }
      try {
        addLog('Đang mở hộp thoại chọn thiết bị...');
        device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'BLE' }],
          optionalServices: [NUS_SERVICE_UUID]
        });
        addLog('Đã chọn: ' + device.name);

        device.addEventListener('gattserverdisconnected', onDisconnected);
        const server = await device.gatt.connect();
        addLog('Đã kết nối GATT server');

        const service = await server.getPrimaryService(NUS_SERVICE_UUID);
        txChar = await service.getCharacteristic(NUS_TX_CHAR_UUID);
        rxChar = await service.getCharacteristic(NUS_RX_CHAR_UUID);

        await rxChar.startNotifications();
        rxChar.addEventListener('characteristicvaluechanged', onNotify);

        refreshUI();
        addLog('✓ Kết nối thành công. Sẵn sàng gửi lệnh!', 'rx');
      } catch (err) {
        addLog(err.name === 'NotFoundError' ? 'Đã hủy chọn thiết bị' : '✗ Lỗi kết nối: ' + err.message,
          err.name === 'NotFoundError' ? 'sys' : 'err');
        refreshUI();
      }
    }

    function onDisconnected() {
      addLog('Thiết bị đã ngắt kết nối');
      txChar = null; rxChar = null; rxBuffer = '';
      ledOn = false; pxOn = false; busy = false;
      refreshUI();
    }

    btnConnect.addEventListener('click', () => {
      if (isConnected()) device.gatt.disconnect();
      else connectBLE();
    });

    function onNotify(event) {
      rxBuffer += new TextDecoder().decode(event.target.value);
      let idx;
      while ((idx = rxBuffer.indexOf('\n')) >= 0) {
        const line = rxBuffer.slice(0, idx).replace(/\r$/, '').trim();
        rxBuffer = rxBuffer.slice(idx + 1);
        if (line) {
          addLog('ESP32: ' + line, 'rx');
          XuLyDuLieuNhanDuoc(line);
        }
      }
    }

    function XuLyDuLieuNhanDuoc(line) {
      const [cmd, value] = line.split(" ");
      if (cmd === "Read" && value !== undefined && !isNaN(Number(value))) {
        updateValue(value);
      }
    }

    async function sendtext(text) {
      if (!txChar) { addLog('Chưa kết nối, không gửi được', 'err'); return false; }
      try {
        addLog('→ ' + text, 'tx');
        const payload = text.endsWith('\n') ? text : text + '\n';
        await txChar.writeValue(new TextEncoder().encode(payload));
        return true;
      } catch (err) {
        addLog('Lỗi gửi: ' + err.message, 'err');
        return false;
      }
    }

    /* ==================== LOG TOOLS ==================== */
    document.getElementById("btnSaveText").addEventListener("click", () => {
      const blob = new Blob([logs.join("\r\n")], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const n = new Date(), p = v => String(v).padStart(2, '0');
      a.download = `Log_${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}_${p(n.getHours())}-${p(n.getMinutes())}-${p(n.getSeconds())}.txt`;
      a.href = url;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      addLog('Lưu log ra file ' + a.download);
    });

    document.getElementById("btnClearLog").addEventListener("click", () => {
      logs.length = 0;
      logContent.replaceChildren();
      addLog('Đã xóa log');
    });

    /* ==================== GIÁ TRỊ DC ==================== */
    const dcInput = document.getElementById('dcInput');
    const dcRange = document.getElementById('dcRange');
    const MIN_VAL = 1, MAX_VAL = 127;
    let dc = 1;

    function updateValue(v) {
      let n = parseInt(v, 10);
      if (isNaN(n)) n = MIN_VAL;
      n = Math.min(MAX_VAL, Math.max(MIN_VAL, n));
      dc = n;
      dcInput.value = n;
      dcRange.value = n;
    }

    document.getElementById('btnIncrease').addEventListener('click', () => updateValue(dc + 1));
    document.getElementById('btnDecrease').addEventListener('click', () => updateValue(dc - 1));
    dcRange.addEventListener('input', () => updateValue(dcRange.value));

    dcInput.addEventListener('input', () => {
      dcInput.value = dcInput.value.replace(/\D/g, '').slice(0, 3);
    });
    dcInput.addEventListener('change', () => updateValue(dcInput.value));
    dcInput.addEventListener('keydown', e => { if (e.key === 'Enter') dcInput.blur(); });
    dcInput.addEventListener('focus', () => dcInput.select());

    async function stopPulseIfOn() {
      if (pxOn) {
        await sendtext("tatpx");
        pxOn = false;
        refreshUI();
      }
    }

    document.getElementById('btnRead').addEventListener('click', async () => {
      await stopPulseIfOn();
      dcInput.value = "";
      setTimeout(() => sendtext('read'), 1500);
    });

    document.getElementById('btnWrite').addEventListener('click', async () => {
      await stopPulseIfOn();
      updateValue(dcInput.value);
      sendtext('write ' + dc);
    });

    /* ==================== LỆNH THỦ CÔNG ==================== */
    const cmdInput = document.getElementById('cmdInput');

    function sendCmdFromInput() {
      const cmd = cmdInput.value.trim();
      if (!cmd || !isConnected()) return;
      sendtext(cmd);
      cmdInput.value = '';
    }
    document.getElementById('btnCmdSend').addEventListener('click', sendCmdFromInput);
    cmdInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); sendCmdFromInput(); }
    });

    /* ==================== LED / XUNG ==================== */
    btnLed.addEventListener('click', async () => {
      if (await sendtext(ledOn ? "led off" : "led on")) ledOn = !ledOn;
      refreshUI();
    });

    btnPx.addEventListener('click', async () => {
      if (await sendtext(pxOn ? "tatpx" : "batpx")) pxOn = !pxOn;
      refreshUI();
    });

    /* ==================== CRC32 ==================== */
    const CRC_TABLE = (() => {
      const t = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i] = c;
      }
      return t;
    })();

    function crc32(buffer) {
      let crc = 0xFFFFFFFF;
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    /* ==================== OTA ==================== */
    const otaBar = document.getElementById('otaBar');
    const otaText = document.getElementById('otaText');

    function setOtaProgress(pct, text) {
      otaBar.style.width = pct + '%';
      otaText.textContent = text;
    }

    async function startOta(arrayBuffer, fileName = "firmware.bin") {
      if (!txChar) { addLog("Chưa kết nối BLE", 'err'); return; }

      const size = arrayBuffer.byteLength;
      const fileCrc = crc32(arrayBuffer);

      addLog(`File: ${fileName}`);
      addLog(`Size: ${(size / 1024).toFixed(1)} KB`);
      addLog(`CRC32: 0x${fileCrc.toString(16).toUpperCase()}`);

      busy = true;
      refreshUI();
      setOtaProgress(0, 'Đang chuẩn bị...');

      await sendtext(`ota begin ${size} ${fileCrc.toString(16)}`);
      await new Promise(r => setTimeout(r, 1200));
      addLog("Bắt đầu gửi dữ liệu...");

      const CHUNK_SIZE = 200, DELAY_MS = 10;
      let offset = 0, lastPercent = -1;

      try {
        while (offset < size) {
          if (!device?.gatt?.connected) {
            addLog("Mất kết nối giữa chừng!", 'err');
            setOtaProgress(otaBar.style.width.replace('%', ''), 'Lỗi: mất kết nối');
            return;
          }
          const end = Math.min(offset + CHUNK_SIZE, size);
          await txChar.writeValue(new Uint8Array(arrayBuffer.slice(offset, end)));
          offset = end;

          const percent = Math.floor((offset / size) * 100);
          setOtaProgress(percent, `Đang nạp ${percent}% (${(offset / 1024).toFixed(0)}/${(size / 1024).toFixed(0)} KB)`);
          if (percent !== lastPercent && (percent % 5 === 0 || percent === 100)) {
            addLog(`Tiến độ: ${percent}%`);
            lastPercent = percent;
          }
          await new Promise(r => setTimeout(r, DELAY_MS));
        }
        addLog("Đã gửi xong. Đợi ESP32 kiểm tra CRC và restart...", 'rx');
        setOtaProgress(100, 'Hoàn tất – chờ ESP32 kiểm tra CRC và restart');
      } catch (err) {
        addLog("Lỗi: " + err.message, 'err');
        setOtaProgress(otaBar.style.width.replace('%', ''), 'Lỗi: ' + err.message);
        try { await sendtext("ota abort"); } catch (e) { }
      } finally {
        busy = false;
        refreshUI();
      }
    }

    /* ----- Modal xác nhận ----- */
    const otaModal = document.getElementById('otaModal');
    const otaModalBody = document.getElementById('otaModalBody');
    let pendingOtaBuffer = null, pendingOtaName = '';

    function showOtaConfirm(buffer, fileName) {
      const size = buffer.byteLength;
      const crc = crc32(buffer);
      pendingOtaBuffer = buffer;
      pendingOtaName = fileName;

      otaModalBody.innerHTML =
        `Bạn sắp cập nhật firmware cho thiết bị qua BLE.\n\n` +
        `📄 File: <span class="info">${fileName}</span>\n` +
        `📦 Kích thước: <span class="info">${(size / 1024).toFixed(1)} KB</span>\n` +
        `🔑 CRC32: <span class="info">0x${crc.toString(16).toUpperCase()}</span>\n\n` +
        `<span class="warn">⚠ Không tắt nguồn / rời khỏi trang trong khi đang nạp.</span>`;
      otaModal.classList.add('show');
    }

    function closeOtaModal() {
      otaModal.classList.remove('show');
      pendingOtaBuffer = null;
      pendingOtaName = '';
    }

    document.getElementById('otaCancel').addEventListener('click', () => {
      addLog('Đã hủy OTA online');
      closeOtaModal();
    });

    document.getElementById('otaConfirm').addEventListener('click', async () => {
      const buffer = pendingOtaBuffer, name = pendingOtaName;
      closeOtaModal();
      if (buffer) await startOta(buffer, name);
    });

    /* ----- Tải từ GitHub ----- */
    document.getElementById("btnOtaOnline").addEventListener("click", async () => {
      if (!txChar) { addLog("Chưa kết nối BLE, không thể OTA online", 'err'); return; }

      const url = "https://raw.githubusercontent.com/tin86pc/dat_DC/main/firmware.bin";
      addLog("Đang tải firmware từ GitHub...");
      setOtaProgress(0, 'Đang tải firmware...');

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const buffer = await response.arrayBuffer();
        if (buffer.byteLength < 20000) throw new Error("File quá nhỏ, có thể không phải firmware");

        addLog(`Đã tải xong ${(buffer.byteLength / 1024).toFixed(1)} KB. Chờ xác nhận...`);
        setOtaProgress(0, 'Chờ xác nhận');
        showOtaConfirm(buffer, "firmware.bin (GitHub)");
      } catch (err) {
        addLog("Lỗi tải file: " + err.message, 'err');
        setOtaProgress(0, 'Lỗi tải file');
      }
    });


  // Thay thế URL bên dưới bằng URL Web App bạn vừa copy ở Bước 1
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUl3ccNuzdlAeDpWec67eogBgbdWmwtpYn7iRhCdx--l__qoJCPM2HFZGBUIY5rk6N/exec";

  function trackVisit() {
    // Chống đếm trùng lặp liên tục trong cùng một phiên duyệt web (tùy chọn)
    // Nếu muốn đếm mỗi lần F5 là 1 lượt thì bỏ qua đoạn session Storage này
    if (sessionStorage.getItem("counted")) return;
    sessionStorage.setItem("counted", "true");

    const data = {
      page: window.location.pathname,
      userAgent: navigator.userAgent
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors", // Cần thiết khi gọi Apps Script từ tên miền khác (GitHub Pages)
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    }).catch(error => console.error("Tracking error:", error));
  }

  // Chạy khi trang đã tải xong
  window.addEventListener("DOMContentLoaded", trackVisit);




    
  </script>
